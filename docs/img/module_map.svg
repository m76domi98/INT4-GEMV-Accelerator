<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">INT4 GEMV Accelerator: module map</text>
  <text x="20" y="48" font-size="12" fill="#555">One full layer (1536 rows, K = 576), output-stationary, TILE_ROWS = 4. Colours show status as of 2026-10-15.</text>

  <!-- Testbench / host -->
  <rect x="20" y="75" width="200" height="90" rx="6" fill="#eceff1" stroke="#90a4ae"/>
  <text x="120" y="100" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Testbench + export</text>
  <text x="120" y="118" font-size="11" text-anchor="middle" fill="#333">export/export_layer.py</text>
  <text x="120" y="133" font-size="11" text-anchor="middle" fill="#333">layer15_up_proj.npz</text>
  <text x="120" y="150" font-size="11" text-anchor="middle" fill="#b26a00">tb/test_layer.py: 2 of 175 vectors</text>

  <!-- Golden model -->
  <rect x="20" y="420" width="200" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="120" y="445" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Golden model</text>
  <text x="120" y="463" font-size="11" text-anchor="middle" fill="#333">model/golden.py: gemv_int</text>
  <text x="120" y="479" font-size="11" text-anchor="middle" fill="#333">integer-only, bit-exact reference</text>
  <text x="120" y="496" font-size="11" text-anchor="middle" fill="#2e7d32">Done (Stage 1)</text>

  <!-- layer_ctrl outer -->
  <rect x="260" y="60" width="720" height="440" rx="10" fill="#fafafa" stroke="#37474f" stroke-width="2"/>
  <text x="275" y="82" font-size="14" font-weight="bold" fill="#111">rtl/layer_ctrl.sv</text>
  <text x="960" y="82" font-size="11" fill="#b26a00" text-anchor="end">Stages 3 and 4: done, checked on 2 of 175 vectors (full set deferred)</text>

  <!-- FSM -->
  <rect x="285" y="100" width="200" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="385" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">FSM</text>
  <text x="385" y="142" font-size="11" text-anchor="middle" fill="#333">IDLE → LOAD → COMPUTE →</text>
  <text x="385" y="156" font-size="11" text-anchor="middle" fill="#333">REQUANT → DONE</text>

  <!-- Memories -->
  <rect x="285" y="185" width="200" height="55" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="385" y="208" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Weight memory</text>
  <text x="385" y="225" font-size="11" text-anchor="middle" fill="#333">16 b per (row group, term)</text>

  <rect x="285" y="255" width="200" height="55" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="385" y="278" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">M memory</text>
  <text x="385" y="295" font-size="11" text-anchor="middle" fill="#333">1536 × 16 b (variant A or B table)</text>

  <rect x="285" y="325" width="200" height="50" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="385" y="348" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Activation buffer</text>
  <text x="385" y="364" font-size="11" text-anchor="middle" fill="#333">576 × INT8</text>

  <!-- Term check -->
  <rect x="520" y="100" width="200" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="620" y="122" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Term check</text>
  <text x="620" y="139" font-size="11" text-anchor="middle" fill="#333">expect_done vs tile done</text>
  <text x="620" y="153" font-size="11" text-anchor="middle" fill="#c62828">err_sticky (cleared only by rst)</text>

  <!-- pe_tile -->
  <rect x="520" y="185" width="200" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="620" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">pe_tile (TILE_ROWS = 4)</text>
  <rect x="535" y="216" width="50" height="30" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="560" y="235" font-size="10" text-anchor="middle" fill="#333">PE r0</text>
  <rect x="590" y="216" width="50" height="30" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="615" y="235" font-size="10" text-anchor="middle" fill="#333">PE r1</text>
  <rect x="645" y="216" width="50" height="30" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="670" y="235" font-size="10" text-anchor="middle" fill="#333">PE r2</text>
  <rect x="535" y="256" width="50" height="30" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="560" y="275" font-size="10" text-anchor="middle" fill="#333">PE r3</text>
  <text x="620" y="298" font-size="10" text-anchor="middle" fill="#2e7d32">pe.sv, pe_tile.sv: Done (Stage 2)</text>

  <!-- requant -->
  <rect x="520" y="325" width="200" height="50" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="620" y="342" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">requant ×1, one row per cycle</text>
  <text x="620" y="357" font-size="10" text-anchor="middle" fill="#333">rtl/requant.sv, stepped through the 4 rows</text>
  <text x="620" y="370" font-size="10" text-anchor="middle" fill="#333">clamp((acc·M + 2¹⁴) &gt;&gt;&gt; 15, −128, 127)</text>

  <!-- Read pipe and outputs -->
  <rect x="760" y="100" width="200" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="860" y="124" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Read pipeline</text>
  <text x="860" y="142" font-size="11" text-anchor="middle" fill="#333">READ_LAT = 1 (tested at 1 only)</text>

  <rect x="760" y="185" width="200" height="55" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="860" y="208" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Saturation counter</text>
  <text x="860" y="225" font-size="11" text-anchor="middle" fill="#333">sat_count, 11 b, per run</text>

  <rect x="760" y="255" width="200" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="860" y="278" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Output buffer</text>
  <text x="860" y="296" font-size="11" text-anchor="middle" fill="#333">1536 × INT8</text>
  <text x="860" y="309" font-size="11" text-anchor="middle" fill="#333">read after layer_done</text>

  <rect x="760" y="325" width="200" height="50" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="860" y="346" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Cycle counters</text>
  <text x="860" y="363" font-size="11" text-anchor="middle" fill="#333">compute_cycles, load_cycles (32 b)</text>

  <!-- Arrows -->
  <line x1="220" y1="120" x2="285" y2="120" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="252" y="112" font-size="10" text-anchor="middle" fill="#555">weights, M, x</text>

  <line x1="485" y1="212" x2="520" y2="212" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="502" y="205" font-size="9" text-anchor="middle" fill="#555">w</text>
  <line x1="485" y1="350" x2="520" y2="265" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="497" y="318" font-size="9" text-anchor="middle" fill="#555">x (broadcast)</text>
  <line x1="485" y1="282" x2="520" y2="350" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="496" y="330" font-size="9" text-anchor="middle" fill="#555">M</text>

  <line x1="620" y1="305" x2="620" y2="325" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="630" y="318" font-size="9" fill="#555">acc</text>
  <line x1="720" y1="345" x2="760" y2="285" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="335" x2="760" y2="225" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="720" y1="130" x2="760" y2="130" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="620" y1="160" x2="620" y2="185" stroke="#c62828" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Golden comparison -->
  <line x1="120" y1="420" x2="120" y2="165" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="130" y="300" font-size="10" fill="#2e7d32">expected outputs compared</text>

  <!-- Legend -->
  <g transform="translate(260,520)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="20" y="11" font-size="11" fill="#333">Done</text>
    <rect x="80" y="0" width="14" height="14" rx="2" fill="#fff3e0" stroke="#b26a00"/>
    <text x="100" y="11" font-size="11" fill="#333">Done, checked on 2 of 175 vectors</text>
    <rect x="330" y="0" width="14" height="14" rx="2" fill="#eceff1" stroke="#90a4ae"/>
    <text x="350" y="11" font-size="11" fill="#333">Test harness</text>
    <text x="0" y="32" font-size="11" fill="#333">Stage 4 variants A and B share this RTL; only the M table differs. Not started: Stage 5 synthesis, 6 error analysis, 7 cycle model, 8 report.</text>
  </g>
</svg>
