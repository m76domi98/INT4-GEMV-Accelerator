<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="1180" height="540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="1180" height="540" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">INT4 GEMV Accelerator: module map</text>
  <text x="20" y="48" font-size="12" fill="#555">One full layer (1536 rows, K = 576), output-stationary, TILE_ROWS = 4. Colours show status as of 2026-10-23.</text>

  <!-- Testbench / host -->
  <rect x="20" y="165" width="210" height="100" rx="6" fill="#eceff1" stroke="#90a4ae"/>
  <text x="125" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Testbench + export</text>
  <text x="125" y="206" font-size="11" text-anchor="middle" fill="#333">export/export_layer.py</text>
  <text x="125" y="221" font-size="11" text-anchor="middle" fill="#333">layer15_up_proj.npz</text>
  <text x="125" y="236" font-size="11" text-anchor="middle" fill="#333">VARIANT=pc|iso picks the M table</text>
  <text x="125" y="253" font-size="11" text-anchor="middle" fill="#b26a00">tb/test_layer.py: 2 of 175 vectors</text>

  <!-- Golden model -->
  <rect x="20" y="345" width="210" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="125" y="370" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Golden model</text>
  <text x="125" y="388" font-size="11" text-anchor="middle" fill="#333">model/golden.py: gemv_int</text>
  <text x="125" y="404" font-size="11" text-anchor="middle" fill="#333">integer-only, bit-exact reference</text>
  <text x="125" y="421" font-size="11" text-anchor="middle" fill="#2e7d32">Done (Stage 1)</text>

  <!-- layer_ctrl outer -->
  <rect x="260" y="60" width="900" height="380" rx="10" fill="#fafafa" stroke="#37474f" stroke-width="2"/>
  <text x="275" y="82" font-size="14" font-weight="bold" fill="#111">rtl/layer_ctrl.sv</text>
  <text x="1145" y="82" font-size="11" fill="#b26a00" text-anchor="end">Stages 3 and 4: done, checked on 2 of 175 vectors (full set deferred)</text>

  <!-- Column 1: FSM and memories -->
  <rect x="285" y="100" width="195" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="382" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">FSM</text>
  <text x="382" y="142" font-size="11" text-anchor="middle" fill="#333">IDLE → LOAD → COMPUTE →</text>
  <text x="382" y="156" font-size="11" text-anchor="middle" fill="#333">REQUANT → DONE</text>

  <rect x="285" y="185" width="195" height="55" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="382" y="207" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Weight memory</text>
  <text x="382" y="224" font-size="11" text-anchor="middle" fill="#333">221,184 × 16 b (4 rows × INT4)</text>

  <rect x="285" y="255" width="195" height="55" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="382" y="277" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Activation buffer</text>
  <text x="382" y="294" font-size="11" text-anchor="middle" fill="#333">576 × INT8</text>

  <rect x="285" y="345" width="195" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="382" y="368" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">M memory</text>
  <text x="382" y="385" font-size="11" text-anchor="middle" fill="#333">1536 × 16 b signed</text>
  <text x="382" y="399" font-size="10" text-anchor="middle" fill="#333">variant A or B table, same size</text>

  <!-- Column 2: counters and read pipeline -->
  <rect x="505" y="100" width="195" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="602" y="124" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Cycle counters</text>
  <text x="602" y="142" font-size="11" text-anchor="middle" fill="#333">compute_cycles, load_cycles (32 b)</text>

  <rect x="505" y="185" width="195" height="125" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="602" y="207" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Read pipeline</text>
  <text x="602" y="225" font-size="11" text-anchor="middle" fill="#333">synchronous read, READ_LAT = 1</text>
  <text x="602" y="240" font-size="11" text-anchor="middle" fill="#333">(tested at 1 only)</text>
  <text x="602" y="262" font-size="10" text-anchor="middle" fill="#333">carries w, x, valid, clr, first</text>
  <text x="602" y="277" font-size="10" text-anchor="middle" fill="#333">clr = term 0 of each row group</text>
  <text x="602" y="292" font-size="10" text-anchor="middle" fill="#333">addr = grp · 576 + term</text>

  <!-- Column 3: term check, tile, requant -->
  <rect x="725" y="100" width="195" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="822" y="122" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Term check</text>
  <text x="822" y="139" font-size="11" text-anchor="middle" fill="#333">own term count vs tile done</text>
  <text x="822" y="153" font-size="11" text-anchor="middle" fill="#c62828">err_sticky (cleared only by rst)</text>

  <rect x="725" y="185" width="195" height="125" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="822" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">pe_tile (TILE_ROWS = 4)</text>
  <rect x="735" y="218" width="40" height="30" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="755" y="237" font-size="10" text-anchor="middle" fill="#333">PE r0</text>
  <rect x="780" y="218" width="40" height="30" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="800" y="237" font-size="10" text-anchor="middle" fill="#333">PE r1</text>
  <rect x="825" y="218" width="40" height="30" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="845" y="237" font-size="10" text-anchor="middle" fill="#333">PE r2</text>
  <rect x="870" y="218" width="40" height="30" rx="3" fill="#ffffff" stroke="#2e7d32"/>
  <text x="890" y="237" font-size="10" text-anchor="middle" fill="#333">PE r3</text>
  <text x="822" y="266" font-size="10" text-anchor="middle" fill="#333">x broadcast, each PE its own 4-b w</text>
  <text x="822" y="280" font-size="10" text-anchor="middle" fill="#333">21-b acc per PE, done 1 cycle after term K</text>
  <text x="822" y="300" font-size="10" text-anchor="middle" fill="#2e7d32">pe.sv, pe_tile.sv: Done (Stage 2)</text>

  <rect x="725" y="345" width="195" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="822" y="364" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">requant ×1, one row per cycle</text>
  <text x="822" y="379" font-size="10" text-anchor="middle" fill="#333">rtl/requant.sv, stepped through the 4 rows</text>
  <text x="822" y="394" font-size="10" text-anchor="middle" fill="#333">clamp((acc·M + 2¹⁴) &gt;&gt;&gt; 15, −128, 127)</text>

  <!-- Column 4: outputs -->
  <rect x="945" y="185" width="195" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="1042" y="208" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Output buffer</text>
  <text x="1042" y="225" font-size="11" text-anchor="middle" fill="#333">1536 × INT8</text>
  <text x="1042" y="239" font-size="11" text-anchor="middle" fill="#333">read after layer_done</text>

  <rect x="945" y="345" width="195" height="60" rx="6" fill="#fff3e0" stroke="#b26a00"/>
  <text x="1042" y="368" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Saturation counter</text>
  <text x="1042" y="385" font-size="11" text-anchor="middle" fill="#333">sat_count, 11 b, cleared per run</text>
  <text x="1042" y="399" font-size="10" text-anchor="middle" fill="#333">lives inside requant.sv</text>

  <!-- Load path -->
  <line x1="230" y1="212" x2="285" y2="212" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="257" y="204" font-size="10" text-anchor="middle" fill="#555">load</text>
  <text x="257" y="228" font-size="9" text-anchor="middle" fill="#555">w, M, x</text>

  <!-- Compute path: memories → read pipeline → tile -->
  <line x1="480" y1="212" x2="505" y2="212" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="492" y="205" font-size="9" text-anchor="middle" fill="#555">w</text>
  <line x1="480" y1="282" x2="505" y2="282" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="492" y="275" font-size="9" text-anchor="middle" fill="#555">x</text>
  <line x1="700" y1="212" x2="725" y2="212" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="712" y="205" font-size="9" text-anchor="middle" fill="#555">w</text>
  <line x1="700" y1="282" x2="725" y2="282" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="712" y="275" font-size="9" text-anchor="middle" fill="#555">x</text>

  <!-- Sticky check inputs -->
  <line x1="680" y1="185" x2="725" y2="150" stroke="#c62828" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="690" y="172" font-size="9" text-anchor="end" fill="#c62828">valid, first</text>
  <line x1="822" y1="185" x2="822" y2="160" stroke="#c62828" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="830" y="177" font-size="9" fill="#c62828">done</text>

  <!-- Requant path -->
  <line x1="822" y1="310" x2="822" y2="345" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="830" y="325" font-size="9" fill="#555">acc[rq_r], 21 b</text>
  <line x1="480" y1="375" x2="725" y2="375" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="602" y="368" font-size="9" text-anchor="middle" fill="#555">M_r for row {grp, rq_r}</text>
  <line x1="920" y1="360" x2="945" y2="230" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="938" y="300" font-size="9" text-anchor="end" fill="#555">y</text>
  <line x1="920" y1="375" x2="945" y2="375" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="932" y="368" font-size="9" text-anchor="middle" fill="#555">sat</text>

  <!-- Golden comparison -->
  <line x1="125" y1="345" x2="125" y2="265" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="135" y="310" font-size="10" fill="#2e7d32">expected outputs compared</text>

  <!-- Legend -->
  <g transform="translate(260,465)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="20" y="11" font-size="11" fill="#333">Done</text>
    <rect x="80" y="0" width="14" height="14" rx="2" fill="#fff3e0" stroke="#b26a00"/>
    <text x="100" y="11" font-size="11" fill="#333">Done, checked on 2 of 175 vectors</text>
    <rect x="330" y="0" width="14" height="14" rx="2" fill="#eceff1" stroke="#90a4ae"/>
    <text x="350" y="11" font-size="11" fill="#333">Test harness</text>
    <line x1="450" y1="7" x2="480" y2="7" stroke="#c62828" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="486" y="11" font-size="11" fill="#333">Sticky-error check</text>
    <text x="0" y="34" font-size="11" fill="#333">Stage 4 variants A and B share this RTL; only the M table differs. Not started: Stage 5 synthesis, 6 error analysis, 7 cycle model, 8 report.</text>
  </g>
</svg>
